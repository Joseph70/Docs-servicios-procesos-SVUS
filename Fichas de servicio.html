<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services Visas US | Manual Interactivo de Servicios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar" aria-label="Servicios">
    <div class="brand">
      <img src="logo-blanco-transparente.png" alt="Services Visas US">
      <div>
        <span>Services Visas US</span>
        <strong>Fichas de Servicio</strong>
      </div>
    </div>

    <nav class="service-menu" id="serviceMenu">
      <button class="service-button active" type="button" data-service="visa-americana">Visa Americana B1/B2 (Negocios y Turismo)</button>
      <button class="service-button" type="button" data-service="visa-americana-f1">Visa Americana F1 (Estudios)</button>
      <button class="service-button" type="button" data-service="visa-schengen">Visa Schengen (Corta Estancia)</button>
      <button class="service-button" type="button" data-service="visa-nacional-trabajo">Visa Nacional de Trabajo</button>
      <button class="service-button" type="button" data-service="visa-nacional-estudios">Visa Nacional de Estudios</button>
      <button class="service-button" type="button" data-service="visa-nacional-reagrupacion-comunitaria">Visa Nacional de Reagrupación Comunitaria</button>
      <button class="service-button" type="button" data-service="visa-nacional-recuperacion-residencia">Visa Nacional Recuperación de Tarjeta de Residencia</button>
      <button class="service-button" type="button" data-service="vuelos">Vuelos</button>
      <button class="service-button" type="button" data-service="tours">Tours</button>
      <button class="service-button" type="button" data-service="seguros">Seguros</button>
    </nav>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <p>Manual interactivo</p>
        <h1 id="pageTitle">Visa Americana B1/B2 (Negocios y Turismo)</h1>
      </div>
      <div class="toolbar" aria-label="Opciones de ficha">
        <button class="icon-button edit-toggle" id="editButton" type="button" aria-label="Editar textos" title="Editar textos">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
          <span>Editar</span>
        </button>
        <button class="icon-button" id="saveButton" type="button" aria-label="Guardar cambios" title="Guardar cambios" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
        </button>
        <button class="icon-button" id="themeToggle" type="button" aria-label="Activar modo oscuro" title="Modo oscuro">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.4 14.5A8.6 8.6 0 0 1 9.5 3.6 8.7 8.7 0 1 0 20.4 14.5Z"></path>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>
        <button class="icon-button" id="printButton" type="button" aria-label="Imprimir ficha" title="Imprimir">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 9V3h12v6"></path>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <path d="M6 14h12v7H6z"></path>
          </svg>
        </button>
        <button class="icon-button" id="wordButton" type="button" aria-label="Exportar Word" title="Exportar Word">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2h8l4 4v16H6z"></path>
            <path d="M14 2v5h5"></path>
            <path d="M8 13h8M8 17h8M8 9h3"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="sheet-shell">
      <article class="service-sheet" id="serviceSheet" aria-live="polite"></article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
